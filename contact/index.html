<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Contact Us — 404 [Come Find Me]</title>
  <!-- Preload brand fonts so headings don't flash -->
  <link rel="preload" href="../fonts/DrukWideBold.ttf" as="font" type="font/ttf" crossorigin>
  <link rel="preload" href="../fonts/Acumin-SemiboldPro.otf" as="font" type="font/otf" crossorigin>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css?v=5">
  <style>
    body { background: #000; color: #fff; }
    .nav { mix-blend-mode: normal; color: #fff; border-bottom: 1px solid rgba(255,255,255,0.06); background: rgba(0,0,0,0.7); backdrop-filter: blur(12px); }
    .nav__logo sup { color: var(--cyan); }
    .footer { background: #000; border-top: 1px solid rgba(255,255,255,0.08); }

    .contact-form { display: grid; gap: 14px; max-width: 640px; margin: 0 auto; }
    .contact-form input,
    .contact-form select,
    .contact-form textarea {
      width: 100%;
      font-family: "Archivo", sans-serif;
      font-size: 15px;
      letter-spacing: 0.02em;
      outline: none;
      border-radius: 10px;
      appearance: none;
      -webkit-appearance: none;
    }
    .contact-form textarea { min-height: 120px; resize: vertical; }
    .contact-form__row { display: grid; gap: 14px; grid-template-columns: 1fr 1fr; }
    @media (max-width: 600px) { .contact-form__row { grid-template-columns: 1fr; } }

    .contact-glow { padding: 140px var(--pad) 80px; }
    .contact-glow__inner {
      max-width: 1100px; margin: 0 auto;
      border-radius: 24px;
      border: 1px solid rgba(255,255,255,0.1);
      background:
        radial-gradient(circle at 15% 20%, rgba(76, 233, 255, 0.16), transparent 45%),
        radial-gradient(circle at 85% 80%, rgba(255, 60, 188, 0.16), transparent 45%),
        #0a0a0a;
      padding: clamp(40px, 5vw, 80px);
    }
    .contact-glow__head { text-align: center; margin-bottom: 48px; }
    .contact-glow__eyebrow {
      font-family: "JetBrains Mono", monospace;
      font-size: 11px; letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--pink);
      margin-bottom: 18px;
    }
    .contact-glow__title {
      font-family: "Archivo Black", sans-serif;
      font-size: clamp(36px, 5vw, 64px);
      line-height: 0.95; letter-spacing: -0.02em;
      margin-bottom: 18px;
    }
    .contact-glow__title em {
      font-style: normal;
      background: linear-gradient(90deg, var(--cyan), var(--pink), var(--yellow));
      -webkit-background-clip: text; background-clip: text; color: transparent;
    }
    .contact-glow__copy { color: rgba(255,255,255,0.65); font-size: 15px; line-height: 1.6; max-width: 560px; margin: 0 auto; }
    .contact-form input,
    .contact-form select,
    .contact-form textarea {
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.12);
      color: #fff;
      padding: 16px 18px;
      backdrop-filter: blur(4px);
    }
    .contact-form input::placeholder,
    .contact-form textarea::placeholder { color: rgba(255,255,255,0.4); }
    .contact-form input:focus,
    .contact-form select:focus,
    .contact-form textarea:focus { border-color: rgba(255, 60, 188, 0.6); background: rgba(255,255,255,0.06); }
    .contact-form select option { background: #0a0a0a; }
    .contact-form__btn {
      margin-top: 8px;
      padding: 16px 32px;
      border-radius: 999px;
      background: #fff; color: #000;
      border: none; cursor: pointer;
      font-family: "JetBrains Mono", monospace;
      font-size: 12px; letter-spacing: 0.16em;
      text-transform: uppercase;
      justify-self: center;
      transition: background .2s, transform .2s;
    }
    .contact-form__btn:hover { background: var(--pink); color: #fff; transform: translateY(-2px); }
  </style>
</head>
<body>

<nav class="nav">
  <a href="../" class="nav__logo">404<sup>*</sup></a>
  <button class="nav__toggle" aria-label="Menu">Menu</button>
  <ul class="nav__links">
    <li><a href="../portfolio/">Portfolio</a></li>
    <li><a href="../about/">About</a></li>
    <li><a href="../contact/" class="active">Contact Us</a></li>
  </ul>
</nav>

<!-- CONTACT FORM -->
<section class="contact-glow">
  <div class="contact-glow__inner">
    <div class="contact-glow__head">
      <div class="contact-glow__eyebrow">// Tell us your story</div>
      <h2 class="contact-glow__title">Bring us<br>a vision.<br><em>We'll reply in 24 hours.</em></h2>
    </div>
    <form class="contact-form" novalidate>
      <div class="contact-form__row">
        <input type="text" name="name" placeholder="Name *" required>
        <input type="tel" name="phone" placeholder="Phone">
      </div>
      <input type="email" name="email" placeholder="Email *" required>
      <select name="service" required>
        <option value="" disabled selected>Service Request *</option>
        <option>Videography</option>
        <option>Photography</option>
        <option>Graphic Design</option>
        <option>Website Design</option>
        <option>Web Maintenance</option>
      </select>
      <textarea name="description" placeholder="Tell us about your project (optional)"></textarea>
      <input type="url" name="website" placeholder="Website (optional)">
      <button type="submit" class="contact-form__btn">Send Inquiry &rarr;</button>
    </form>
  </div>
</section>

<!-- FOOTER -->
<footer class="footer">
  <div class="footer__col">
    Bridging human creativity,<br>
    experiences, and business goals<br>
    together.
  </div>
  <div class="footer__col">
    <a href="../portfolio/">Portfolio</a><br>
    <a href="../about/">About</a><br>
    <a href="../contact/">Contact</a>
  </div>
  <div class="footer__col footer__col--right">
    <a href="#">Instagram</a><br>
    <a href="#">YouTube</a><br>
    404cfm<br>
    @gmail.com
  </div>
</footer>

<script src="../js/main.js"></script>
</body>
</html>
